default = """
**TODO：执行摘要**

此处填写执行摘要：概述本次渗透测试的目标、范围、总体结论以及最重要的发现。执行摘要应面向管理层读者，避免过多技术细节，突出风险最高的漏洞及其对业务的潜在影响，并给出总体修复建议与后续工作安排。本段为占位文本，用于展示正文段落排版效果，正式交付前请替换为实际内容。

其次可以补充说明被测系统的整体安全态势、与行业基线或合规要求的差距，以及修复工作的优先级排序建议。此处为第二段占位文本，请根据实际测试结果撰写。

最后可以说明严重程度评级标准（CVSS）、报告的阅读方式以及复测安排等事项，便于读者理解报告后续章节。
"""
