  <markdown :text="report.scope" />
  <pagebreak />
</section>


<section id="section-findings-summary" data-sysreptor-rendersections="choosable" data-sysreptor-rendersections-name="漏洞总览">
  <h1 id="findings-summary" class="in-toc">漏洞总览</h1>
  <p>
    在本次渗透测试过程中，共发现以下漏洞：
    <comma-and-join>
      <template #critical v-if="finding_stats.count_critical > 0"><strong class="risk-critical">{{ finding_stats.count_critical }} 个严重</strong></template>
      <template #high v-if="finding_stats.count_high > 0"><strong class="risk-high">{{ finding_stats.count_high }} 个高危</strong></template>
      <template #medium v-if="finding_stats.count_medium > 0"><strong class="risk-medium">{{ finding_stats.count_medium }} 个中危</strong></template>
      <template #low v-if="finding_stats.count_low > 0"><strong class="risk-low">{{ finding_stats.count_low }} 个低危</strong></template>
      <template #info v-if="finding_stats.count_info > 0"><strong class="risk-info">{{ finding_stats.count_info }} 个提示</strong></template>
    </comma-and-join>
  </p>

  <figure>
    <chart :width="15" :height="10" :config="{
        type: 'bar', 
        data: {
            labels: ['严重', '高危', '中危', '低危', '提示'],
            datasets: [{
                data: [
                    finding_stats.count_critical,
                    finding_stats.count_high,
                    finding_stats.count_medium,
                    finding_stats.count_low,
                    finding_stats.count_info
                ],
                backgroundColor: [
                    cssvar('--color-risk-critical'), 
                    cssvar('--color-risk-high'), 
                    cssvar('--color-risk-medium'), 
                    cssvar('--color-risk-low'), 
                    cssvar('--color-risk-info')
                ],
            }]
        },
        options: {
            scales: {y: {beginAtZero: true, ticks: {precision: 0}}}, 
            plugins: {legend: {display: false}},
        }
    }" />
    <figcaption id="distribution-of-identified-vulnerabilities">已识别漏洞分布</figcaption>
  </figure>

  <div>
    <p>所有已识别漏洞的表格总览如下：</p>
    <table class="finding-summary-table">
      <thead>
        <tr>
          <th style="width: auto;">漏洞</th>
          <th style="width: 6em;" align="center">严重程度</th>
          <th v-if="report.is_retest" style="width: 10em;" align="center">修复状态</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="finding in findings">
          <td>
            <ref :to="finding.id">{{ finding.title }}</ref>
          </td>
          <td align="center">
            <ref :to="finding.id" :class="'risk-' + finding.cvss.level">{{ {critical: '严重', high: '高危', medium: '中危', low: '低危', info: '提示'}[finding.cvss.level] || lodash.capitalize(finding.cvss.level) }}</ref>
          </td>
          <td v-if="report.is_retest" align="center">
            <ref :to="finding.id" :class="'status-' + finding.retest_status.value">{{ finding.retest_status.label }}</ref>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="findings-list findings-overview-list">
    <p>所有漏洞及其简要描述列表如下：</p>
    <div v-for="(finding, findingIndex) in findings">
      <h6 :id="finding.id + 'overview'">
        <ref :to="finding.id" class="finding-title">{{ finding.title }}</ref>
        (<span :class="'risk-' + finding.cvss.level"><a v-if="finding.cvss.vector.startsWith('CVSS:3.1')" :href="'https://www.first.org/cvss/calculator/3.1#' + finding.cvss.vector" class="link-none">{{ {critical: '严重', high: '高危', medium: '中危', low: '低危', info: '提示'}[finding.cvss.level] || capitalize(finding.cvss.level) }}: {{ finding.cvss.score}}</a><a v-else-if="finding.cvss.vector.startsWith('CVSS:3.0')" :href="'https://www.first.org/cvss/calculator/3.0#' + finding.cvss.vector" class="link-none">{{ finding.cvss.score }}</a><template v-else>{{ {critical: '严重', high: '高危', medium: '中危', low: '低危', info: '提示'}[finding.cvss.level] || capitalize(finding.cvss.level) }}: {{ finding.cvss.score }}</template></span><template v-if="report.is_retest || (finding.retest_status.value && finding.retest_status.value !== 'open')"> | <span :class="'status-' + (finding.retest_status.value || 'open')">{{ finding.retest_status.label || '未修复' }}</span></template>)
      </h6>

      <div v-if="finding.affected_components && finding.affected_components.length > 0">
        受影响组件：
        <markdown v-if="finding.affected_components.length == 1" :text="finding.affected_components[0]" class="markdown-inline" />
        <ul v-else class="location-ul">
          <li v-for="component in finding.affected_components">
            <markdown :text="component" class="markdown-inline" />
          </li>
        </ul>
      </div>
      <markdown :text="finding.summary" />
    </div>
  </div>

  <pagebreak />
</section>

<section id="findings-list" class="findings-list">
  <h1 id="findings-details" class="in-toc">漏洞详情</h1>
  <div v-for="(finding, findingIndex) in findings" :id="'findingsection-' + finding.id" data-sysreptor-rendersections="choosable" :data-sysreptor-rendersections-name="'漏洞发现：' + finding.title">
    <h2 :id="finding.id" class="in-toc" :data-toc-title="finding.title + ' (' + ({critical: '严重', high: '高危', medium: '中危', low: '低危', info: '提示'}[finding.cvss.level] || capitalize(finding.cvss.level)) + ')'">
      <ref :to="finding.id + 'overview'" class="finding-title">{{ finding.title }}</ref>
    </h2>

    <div>
      <template v-if="report.is_retest || finding.retest_status.value !== 'open'">
        <strong>修复状态：</strong><span :class="'status-' + finding.retest_status.value">{{ finding.retest_status.label }}</span><br>
      </template>
      <strong>严重程度：</strong><span :class="'risk-' + finding.cvss.level">{{ {critical: '严重', high: '高危', medium: '中危', low: '低危', info: '提示'}[finding.cvss.level] || capitalize(finding.cvss.level) }}</span><br>
      <strong>CVSS 评分：</strong>
      <span :class="'risk-' + finding.cvss.level">
        <a v-if="finding.cvss.vector.startsWith('CVSS:3.1')" :href="'https://www.first.org/cvss/calculator/3.1#' + finding.cvss.vector" class="link-none">{{ finding.cvss.score}}</a>
        <a v-else-if="finding.cvss.vector.startsWith('CVSS:3.0')" :href="'https://www.first.org/cvss/calculator/3.0#' + finding.cvss.vector" class="link-none">{{ finding.cvss.score }}</a>
        <span v-else>{{ finding.cvss.score }}</span>
      </span><br>
      <template v-if="finding.affected_components && finding.affected_components.length > 0">
        <strong>受影响组件：</strong>
        <markdown v-if="finding.affected_components.length == 1" :text="finding.affected_components[0]" class="markdown-inline" />
        <ul v-else class="location-ul">
          <li v-for="component in finding.affected_components">
            <markdown :text="component" class="markdown-inline" />
          </li>
        </ul>
      </template>
      <template v-if="finding.short_recommendation">
        <strong>修复建议：</strong>
        <markdown :text="finding.short_recommendation" class="markdown-inline" /><br>
      </template>
    </div>

    <div>
      <h3>概要</h3>
      <markdown :text="finding.summary" />
    </div>

    <div v-if="finding.retest_notes">
      <h3>复测备注</h3>
      <markdown :text="finding.retest_notes" />
    </div>

    <div>
      <h3 :id="finding.id + '-description'">技术描述</h3>
      <markdown :text="finding.description" />
    </div>

    <div>
      <h3 :id="finding.id + '-recommendation'">修复建议</h3>
      <markdown :text="finding.recommendation" />
    </div>

    <div v-if="finding.references && finding.references.length > 0">
      <h3>参考资料</h3>
      <ul>
        <li v-for="reference in finding.references">
          <a :href="reference">{{ reference }}</a>
        </li>
      </ul>
    </div>

    <pagebreak />
  </div>
</section>

<section>
  <h1 id="document-history" class="in-toc">变更记录</h1>
  <table>
    <thead>
      <tr>
        <th style="width: 4em;" align="center">版本</th>
        <th style="width: 6em;" align="center">日期</th>
        <th style="width: auto;">描述</th>
        <th style="width: 12em;">作者</th>
