[report_preview_data]
[report_preview_data.report]
title = "示例 Web 应用渗透测试报告"
executive_summary = """
本次受示例科技有限公司委托，对其 Web 应用开展渗透测试。测试范围覆盖身份认证、会话管理、权限控制以及核心业务流程。测试过程中共发现多个安全漏洞，其中包括一处可导致数据库敏感信息泄露的 SQL 注入漏洞。总体来看，应用的安全状况有待改进，建议按照严重程度由高到低尽快完成修复，并在修复完成后安排复测。

严重级别较高的漏洞一旦被攻击者利用，可能直接威胁业务系统的机密性与完整性，应作为最高优先级处理。中低危漏洞单独利用风险有限，但若被攻击者组合利用，同样可能形成完整攻击链，建议纳入常态化安全运维流程一并整改。

本报告后续章节详细记录了每个漏洞的技术细节、影响分析与修复建议，请结合漏洞总览章节的统计图表阅读。执行摘要旨在帮助管理层快速了解整体风险状况与整改优先级。
"""
scope = """
本次测试采用黑盒与灰盒相结合的方式，参考 OWASP Testing Guide 与 PTES 方法论对目标系统开展渗透测试。测试时间为 2022-07-08 至 2022-07-08，投入人天数见报告字段"测试工期"。

* https://example-app.shili.com：面向互联网的 Web 应用入口，包含登录、注册与密码找回功能，重点覆盖认证与会话管理逻辑。
* https://api.shili.com/v1：后端 API 接口，供 Web 应用与移动客户端调用，重点覆盖权限校验与输入处理。
* 10.10.10.0/24：内网测试网段，包含应用服务器与数据库服务器，仅进行授权范围内的端口与服务验证。

上述范围之外的系统与资产不在本次评估之列。测试过程中如发现范围外的重大风险，将以独立事项另行通报客户。
"""
