        <td align="center">{{ item.date }}</td>
        <td>{{ item.description }}</td>
        <td>
          <comma-and-join>
            <template v-for="author in item.authors" #[author]>{{ author }}</template>
          </comma-and-join>
        </td>
      </tr>
    </tbody>
  </table>
</section>

