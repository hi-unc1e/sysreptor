}

.location-ul {
    margin: 0;
    margin-bottom:0.2em;
}



/* #region header */
@page {
    margin-top: 35mm;

    --header-background-color: black;
    --header-margin-bottom: 5mm;

    @top-left-corner {
        content: "";
        margin-bottom: var(--header-margin-bottom);
        background-color: var(--header-background-color); 
    }
    @top-left { 
        content: element(header-left); 
        margin-bottom: var(--header-margin-bottom);
        background-color: var(--header-background-color); 
        width: 51%;
        margin-left: -1px;
        margin-right: -1px;
    }
    @top-right { 
        content: element(header-right); 
        margin-bottom: var(--header-margin-bottom);
        background-color: var(--header-background-color);  
        width: 51%;
        margin-left: -1px;
        margin-right: -1px;
    }
    @top-right-corner { 
        content: "";
        margin-bottom: var(--header-margin-bottom); 
        background-color: var(--header-background-color); 
    }
}
#header {
    position: absolute;
    width: 0;
}
#header #header-left { position: running(header-left); }
#header #header-left {
    width: 60%;
}
