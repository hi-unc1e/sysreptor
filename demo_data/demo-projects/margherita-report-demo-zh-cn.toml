[[findings]]
id = "f86bf000-65fb-4146-baca-d09c53e22822"
status = "in-progress"

[findings.data]
title = "跨站请求伪造（CSRF）"
cvss = "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:N"
summary = """
该 Web 应用存在跨站请求伪造（CSRF）漏洞。
CSRF 是一种诱使用户在不知情的情况下，向其当前已通过身份认证的 Web 应用发送 HTTP 请求的攻击方式。
攻击者可借此部分绕过浏览器的同源策略，以受影响用户的身份执行会改变状态的操作。
视操作性质而定，攻击者可能借此完全接管用户的账户。
若受影响账户为管理员账户，CSRF 还可能导致整个 Web 应用被攻陷。
"""
description = """
我们在该 Web 应用中发现了一个 CSRF 漏洞，攻击者可借此以其他用户的身份执行操作。

跨站请求伪造（CSRF）是一种 Web 安全漏洞，攻击者可以诱骗已认证的用户在不知情的情况下，向存在漏洞的 Web 应用发送会改变状态的 HTTP 请求。
在 CSRF 攻击中，攻击者冒用受害者的身份及其访问权限，代替其执行非预期操作（例如更改电子邮件地址）。
若缺乏相应的 CSRF 防护，Web 应用将无法区分攻击者构造的请求与受害者发起的合法请求。

CSRF 攻击的发生需要满足若干前提条件。
首先，Web 应用中必须存在对攻击者有价值、值得利用的操作。
例如，这类操作可以是特权操作，如更改用户的访问权限或修改密码。
另一个前提是，除基于 Cookie 的身份认证之外，不存在其他可用于区分不同用户 HTTP 请求的机制。
当用户已通过认证并持有有效的会话 Cookie 时，Web 应用便无法区分来自攻击者的恶意伪造请求与来自受害者的合法请求。
最后，还需确保相关操作不要求攻击者无法确定或预测其值的特定参数。
例如，若修改密码功能要求提供当前密码，则该功能不存在 CSRF 漏洞，因为攻击者必须知道原密码的值。

利用 CSRF 漏洞的常见方式是钓鱼邮件。
攻击者事先构造恶意链接，意图将改变状态的请求强加给受害者。
随后，攻击者通过电子邮件将恶意链接分发给受害者。
当用户在浏览器中打开该链接且正处于已认证状态时，请求便会被发送至存在漏洞的 Web 应用。
攻击一旦成功，就会以受害者的身份及其权限级别执行相应的操作。
"""
recommendation = """
* 检查所用框架是否内置 CSRF 防护机制并加以启用。若无，须确保所有会改变状态的请求均包含随机生成的高熵 CSRF 令牌，并确保在后端对 CSRF 令牌进行正确校验。
* 考虑采取多种额外的安全措施：
    * 例如，为会话 Cookie 设置 SameSite 属性。浏览器将依据该属性决定是否在跨站请求中携带 Cookie。
    * 使用自定义请求头（Custom Request Headers）。默认情况下，浏览器的同源策略会限制 JavaScript 发起携带自定义请求头的跨站请求。
    * 对于高度敏感的操作，还可以考虑将 CAPTCHA 验证码、一次性令牌、重新认证等用户交互方式作为额外的 CSRF 防护。
* 有关防范 CSRF 漏洞的详细信息和指导，请参阅 OWASP 的跨站请求伪造防范速查表（Cross-Site Request Forgery Prevention Cheat Sheet）。
"""
references = [
    """https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html""",
]
affected_components = [
    "example.com",
]
short_recommendation = "确保所有会改变状态的 HTTP 请求均包含随机生成的高熵 CSRF 令牌，并在后端对其进行校验。"

[[findings]]
id = "9d63ad73-470f-4867-a0f3-f6592b94783d"
status = "in-progress"

[findings.data]
title = "存储型跨站脚本（Stored XSS）"
cvss = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N"
summary = """
测试期间，该 Web 应用对用户输入未做校验即予以存储，随后又以不安全的方式将其包含在 HTTP 响应中。
因此，该应用存在存储型跨站脚本（Stored XSS）漏洞。
存储型 XSS 漏洞的利用无需用户交互，因而比反射型 XSS 漏洞更加危险。
"""
description = """
我们在测试期间发现该 Web 应用存在一个存储型 XSS 漏洞。
由于数据校验与编码处理不正确，我们得以向 Web 应用注入恶意脚本并将其持久化存储。

跨站脚本（XSS）是一种常见的 Web 安全漏洞，由于对数据缺乏充分的校验或编码，攻击者可以向 Web 应用注入恶意脚本。
在 XSS 攻击中，攻击者将 JavaScript 代码嵌入存在漏洞的 Web 应用所返回的内容之中。

存储型 XSS 攻击的目标是将脚本代码植入其他用户会访问的页面上。
受害者只需访问受影响的子页面，脚本代码便会在其浏览器中执行。

发起攻击时，攻击者向 Web 应用注入恶意脚本，这些脚本被应用存储，并被包含在应用后续的 HTTP 响应中。
恶意脚本最终会在受害者的浏览器中执行，并可能访问 Cookie、会话令牌或其他敏感信息。

攻击一旦成功，攻击者便能在受害者的上下文中控制 Web 应用的功能与数据。
若受影响的用户拥有特权访问权限，攻击者甚至可能完全控制该 Web 应用。
"""
recommendation = """
* 确保对所有经处理的数据进行尽可能严格的过滤。过滤与校验应基于预期且合法的输入进行。
* 在 Web 应用将数据包含进 HTTP 响应之前，应对数据进行编码。编码应结合上下文进行，即根据 Web 应用将数据插入 HTML 文档的位置，选用相应的编码语法。
* 对于不包含 HTML 和 JavaScript 的 HTTP 响应，可以设置 HTTP 头 `Content-Type`（例如 `text/plain`）和 `X-Content-Type-Options: nosniff`。
* 建议额外使用内容安全策略（CSP），以控制允许和禁止执行哪些客户端脚本。
* 有关防范 XSS 的详细信息和帮助，请参阅 OWASP 的跨站脚本防范速查表（Cross-Site Scripting Prevention Cheat Sheet）。
"""
references = [
    """https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html""",
]
affected_components = [
    "example.com",
]
short_recommendation = "应基于预期或合法的输入对用户输入进行校验和过滤。并确保数据在被包含进 HTTP 响应之前，已结合上下文进行了正确的编码。"

[[findings]]
id = "80bf613d-666c-4908-80b2-b0f44627bb68"
status = "in-progress"

[findings.data]
title = "XML 外部实体注入（XXE）"
cvss = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H"
summary = """
该 Web 应用以不安全的方式处理 XML 文档，因而存在 XML 外部实体（XXE）注入漏洞。
XXE 注入是 Web 应用中的一类漏洞，允许攻击者干扰 XML 解析器对 XML 文档的处理。
此类攻击可能导致机密数据泄露、拒绝服务、服务器端请求伪造（SSRF），以及对底层系统或其他后端系统造成其他严重影响。
"""
description = """
我们在该 Web 应用中发现了一个 XXE 注入漏洞。
该应用的 XML 解析器允许定义 XXE，因此可以构造恶意的 XML 文档。
该 XXE 包含一个指向外部域名的 URL。
解析器解引用该 XXE 后，Web 应用便与该域名发生了交互，这一点可由 DNS 请求得到证实。

可扩展标记语言（XML）是一种标准化的标记语言和文件格式，用于存储、传输和重建任意数据。
该语言以人类和机器均可读取的格式对数据进行编码。
XML 文档的结构由 XML 标准定义。
该标准引入了称为“实体（Entity）”的概念。
实体提供了一种引用内容的能力，这些内容既可以由服务器远程提供，也可以驻留在服务器本地。
XML 解析器在解析 XML 文档时，会将其中包含的实体替换为被引用的值。
实体定义在所谓的文档类型定义（DTD）之中。

DTD 定义了 XML 文档的结构和组成。
DTD 既可以完全包含在 XML 文档自身中（即所谓的内部 DTD），也可以从其他位置加载（即所谓的外部 DTD）。
两种方式的组合也是可能的。
XML 外部实体（XXE）是 XML 实体的一种特殊形式，其内容从声明它的 DTD 之外的位置加载。

XXE 在 DTD 中使用 SYSTEM 关键字以及一个指定内容加载来源的 URI 进行声明。
例如：

`<!DOCTYPE dtd [ <!ENTITY xxe SYSTEM "http://syslifters.com" > ]>`

该 URI 还可以使用 `file://` 协议方案。
这样便可以从本地文件加载内容。
例如：

`<!DOCTYPE dtd [ <!ENTITY xxe SYSTEM "file:///path/to/local/file" > ]>`

XML 解析器在解析 XML 文档时，会通过解引用所定义的 URI，将文档中出现的 XXE 替换为其内容。
若 URI 中包含被篡改的数据，可能造成严重后果。
攻击者可利用这一点发起服务器端请求伪造（SSRF）攻击，进而攻陷底层服务器或其他后端基础设施。
XXE 注入漏洞还可被用于造成服务/应用不可用（拒绝服务），或泄露本地系统文件等敏感数据。
"""
recommendation = """
* 应将 XML 解析器配置为使用本地静态 DTD，并禁止解析 XML 文档中声明的外部 DTD。
* 建议将 XML 解析库的功能限制在所需的最低范围内（参见所用库的文档）。
* 如有可能，应在解析之前对用户输入进行校验。
* 有关防范 XXE 注入的详细信息和帮助，请参阅 OWASP 的 XML 外部实体防范速查表（XML External Entity Prevention Cheat Sheet）。
"""
references = [
    """https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html""",
]
affected_components = [
    "example.com",
]
short_recommendation = "在 XML 解析库中禁用对外部 DTD 的支持。"

[[findings]]
id = "6000af80-94f3-4429-b6d1-7c5c6ffef18a"
status = "in-progress"

[findings.data]
title = "不安全的 HTTP Cookie"
cvss = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N"
summary = """
该 Web 应用下发的 HTTP Cookie 未设置 _HttpOnly_ 和/或 _Secure_ Cookie 属性。
若未设置 _HttpOnly_ 属性，受影响的 Cookie 可能被 JavaScript 在客户端读取或篡改。
若未设置 _Secure_ 属性，浏览器在未加密的 HTTP 连接上也会发送该 Cookie。
会话 Cookie 等配置不安全的 Cookie 会扩大 Web 应用的潜在攻击面。
这使攻击者更容易利用跨站脚本（XSS）等客户端漏洞，或通过轻易窃听 Cookie 来危害会话。
"""
description = """
HTTP 是一种无状态协议，在没有额外机制的情况下无法区分来自不同用户的请求。
为解决该问题，需要引入会话机制。
浏览器中最常用的 HTTP 会话管理机制是 Cookie 存储。
HTTP Cookie 是服务器发送给用户 Web 浏览器的一小段数据记录。
浏览器可以存储该 Cookie，并在后续请求中将其发回同一服务器。
借此可为无状态的 HTTP 协议实现会话功能。
HTTP Cookie 可用于区分来自不同用户的请求，并保持用户的登录状态。

因此，Cookie 是攻击者的常见目标。
Web 应用应对所有敏感 Cookie 的配置进行加固。
这可以通过设置 _Secure_ 和 _HttpOnly_ Cookie 属性来实现。
设置了 _Secure_ 属性的 Cookie 仅通过 HTTPS 连接发送到服务器，绝不会通过不安全的 HTTP 连接发送。
设置了 _HttpOnly_ 属性的 Cookie 无法被 JavaScript 访问，从而有助于缓解跨站脚本（XSS）攻击。
如果攻击者能够窃取会话 Cookie 等敏感 Cookie，便可接管用户账户，并以受影响用户的身份执行操作。
若被接管的是具有特权访问权限的账户，攻击者还可能完全控制 Web 应用的所有功能和数据。

审计人员检查了该 Web 应用敏感 HTTP Cookie 所设置的属性。下表概述了已设置的属性：

| Cookie | Secure | HttpOnly |
|:---:|:---:|:---:|
| PHPSESSID | - | - |
"""
