[findings.data]
title = "SQL 注入（SQLi）"
cvss = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
summary = """
该 Web 应用以不安全的方式处理用户输入，因此存在 SQL 注入漏洞。
在 SQL 注入攻击中，攻击者通过在 Web 应用中提交特殊的输入值，来影响应用发往数据库的 SQL 语句。
视所使用的数据库及应用设计而定，攻击者可能借此读取和修改数据库中存储的数据、执行管理操作（例如关闭 DBMS），在某些情况下甚至能够获取代码执行能力，进而完全控制存在漏洞的服务器。
"""
description = """
我们在该 Web 应用中发现了一个 SQL 注入漏洞，并据此成功访问了数据库中存储的数据。

SQL 注入是 Web 应用中常见的服务端漏洞。
当软件开发人员构建包含用户输入的动态数据库查询时，便可能引入该漏洞。
在攻击中，攻击者通过精心构造用户输入，改变 SQL 语句原本预期的执行逻辑。
SQL 注入漏洞的根源在于应用未能安全地构建动态数据库查询，也未能正确校验用户输入。
其根本原因在于 SQL 语言本身并不区分控制字符与数据字符。
若要在 SQL 语句的数据部分使用控制字符，必须事先对其进行恰当的编码或转义。

因此，SQL 注入攻击的本质是向用户输入中插入诸如 `'`（单引号）之类的控制字符，从而注入原始 SQL 语句中并不存在的新命令。
下面通过一个简单的示例演示这一过程。
以下 SELECT 语句包含变量 userId，其目的是从 Users 表中获取指定用户 ID 的用户数据。

```python
sqlStmnt = 'SELECT * FROM Users WHERE UserId = ' + userId;
```

攻击者此时可以利用特殊的用户输入，改变该 SQL 语句的原始意图。
例如，攻击者可以提交字符串 `' or 1=1` 作为用户输入。
此时，应用将构造出如下 SQL 语句：

```python
sqlStmnt = 'SELECT * FROM Users WHERE UserId = ' + ' or 1=1;
```

执行该语句后，返回给攻击者的不再是具有特定用户 ID 的用户数据，而是表中所有用户的数据。
这使攻击者能够按照自身意图控制 SQL 语句。

SQL 注入漏洞、攻击和技术存在多种变体，出现于不同的场景，并依赖于所使用的数据库系统。
但它们的共同点在于：如上例所示，用户输入总是被用于动态构造 SQL 语句。
成功的 SQL 注入攻击可能造成深远的影响。
其后果之一是存储数据的机密性和完整性受损。
攻击者可能获得对数据库中敏感数据的读取权限，甚至是写入权限。
SQL 注入还可能破坏 Web 应用的身份认证与授权机制，使攻击者得以绕过既有的访问控制。
在某些情况下，SQL 注入还可用于获取代码执行能力，使攻击者完全控制存在漏洞的服务器。
"""
recommendation = """
* 在整个应用中统一使用预编译语句（Prepared Statements），以有效避免 SQL 注入漏洞。预编译语句是参数化查询语句，即使输入值被篡改，攻击者也无法改变 SQL 语句的原始意图。
* 尽可能默认使用现成的存储过程（Stored Procedures）。通常，存储过程以安全的参数化查询方式实现，从而能够防御 SQL 注入。
* 始终对所有用户输入进行校验，确保应用仅接受符合预期且合法的输入。不应尝试对潜在的恶意输入进行“净化”处理。
* 为降低 SQL 注入攻击成功后可能造成的损害，应遵循最小权限原则，尽量收缩所用数据库账户的权限。
* 有关防范 SQL 注入漏洞的详细信息和指导，请参阅 OWASP 的 SQL 注入防范速查表（SQL Injection Prevention Cheat Sheet）。
"""
references = [
    "https://www.owasp.org/index.php/SQL_Injection_Prevention_Cheat_Sheet",
]
affected_components = [
    "example.com",
]
short_recommendation = """确保在整个应用中使用预编译语句（Prepared Statements），并在可能的情况下使用存储过程（Stored Procedures）。这样可以防止攻击者篡改 SQL 语句原本预期的执行逻辑。"""

