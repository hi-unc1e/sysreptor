[translations.data]
title = "OS Command Injection / Remote Code Execution (RCE)"
cvss = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H"
summary = """
The application concatenated untrusted input into operating-system commands or otherwise allowed remote code execution. An attacker can inject shell metacharacters or crafted payloads to run arbitrary commands on the server, leading to full compromise of confidentiality, integrity, and availability, and potentially pivoting into the internal network.
"""
description = """
We identified an OS command injection / remote code execution vulnerability in the application and were able to execute arbitrary system commands in the server context.

**TODO: technical description**

Command injection occurs when user-controlled data is passed to a shell or OS API (e.g. `system()`, `exec()`, `popen()`, `Runtime.exec`, `ProcessBuilder` with a shell, backticks, or `os.system`) without strict validation and without separating arguments from the command. Classic payloads use metacharacters such as `;`, `|`, `&&`, `$()`, backticks, and newlines to append additional commands.

Common high-risk surfaces:

- Diagnostics and admin tools (ping, traceroute, nslookup wrappers);
- File conversion, image/video processing, or archive utilities invoked via shell;
- Job schedulers or scripting features that accept user parameters;
- Template engines or expression languages that allow code evaluation (SSTI leading to RCE);
- Deserialization of untrusted data into executable objects.

Impact typically includes reading secrets (config, keys, credentials), writing webshells, establishing reverse shells, and lateral movement. Because the process often runs with elevated application privileges, blast radius is high; the CVSS scope may be Changed when adjacent systems are reachable.
"""
recommendation = """
* Avoid invoking a shell. Prefer language APIs that take argument arrays (no shell interpretation), e.g. `subprocess.run([...], shell=False)`, `ProcessBuilder` with discrete args.
* If external programs are required, use a strict allowlist of commands and arguments; never concatenate user input into the command string.
* Validate input against a narrow allowlist (e.g. IPv4/IPv6 for ping) rather than attempting to sanitize metacharacters.
* Run the application with least privilege; isolate command-executing components (containers, separate users, seccomp/AppArmor).
* Disable dangerous template/expression evaluation and untrusted deserialization.
* Detailed guidance: OWASP Command Injection and OS Command Injection Defense Cheat Sheet.
"""
short_recommendation = "Do not pass untrusted input to a shell; use argument arrays, strict allowlists, and least-privilege process isolation."
references = [
    "https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html",
    "https://owasp.org/www-community/attacks/Command_Injection",
]
affected_components = []

