[translations.data]
title = "Reflected Cross-Site Scripting (XSS)"
cvss = "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N"
summary = """
The web application reflected user-controlled input in HTTP responses without adequate validation or contextual encoding. It was thus vulnerable to reflected cross-site scripting (XSS). An attacker can craft a malicious URL that, when opened by a victim, executes attacker-controlled JavaScript in the victim's browser context and may steal session tokens, modify page content, or perform actions as the victim.
"""
description = """
We identified a reflected XSS vulnerability in the web application. User input was echoed into the response without proper encoding, allowing injection of script code.

**TODO: technical description**

Reflected XSS (also called non-persistent XSS) occurs when an application includes request data in the immediate response without sufficient validation or encoding. Unlike stored XSS, the payload is not persisted; the victim must be induced to visit a crafted URL (phishing, social media, ads, or an open redirect).

Typical injection points include:

- Search, error, and filter parameters reflected in the page;
- Query strings reflected into HTML attributes, JavaScript contexts, or event handlers;
- Custom headers or path segments echoed into error pages.

Successful exploitation can:

- Steal session cookies or tokens (if not HttpOnly) and hijack the account;
- Perform CSRF-like actions in the victim's authenticated session;
- Rewrite the DOM for phishing or malware delivery;
- Bypass weaker CSP policies when unsafe-inline or overly broad sources are allowed.

Reflected XSS generally requires user interaction (clicking a link), which is reflected in the CVSS UI:R rating, but remains a high-impact finding for privileged or high-value user populations.
"""
recommendation = """
* Validate and filter all user input based on expected and valid values for each parameter.
* Contextually encode data before including it in HTTP responses (HTML body, attribute, JavaScript, URL, CSS contexts each need the appropriate encoder).
* Set `Content-Type` appropriately and add `X-Content-Type-Options: nosniff` for non-HTML responses.
* Deploy a strict Content Security Policy (CSP) that disallows unsafe-inline and unsafe-eval where feasible.
* Prefer framework auto-escaping templates; avoid concatenating untrusted data into HTML or script blocks.
* Detailed guidance: OWASP Cross-Site Scripting Prevention Cheat Sheet.
"""
short_recommendation = """\
Validate user input and contextually encode it before reflecting it in HTTP responses. \
Use a strict Content Security Policy as defense in depth.\
"""
references = [
    "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html",
    "https://owasp.org/www-community/attacks/xss/",
]
affected_components = []

