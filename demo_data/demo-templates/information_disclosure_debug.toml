[translations.data]
title = "Debug / Actuator / Swagger Endpoints Exposed"
cvss = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
summary = """
Production (or internet-facing) environments expose debug, monitoring, or API documentation endpoints without adequate authentication. Examples include Spring Boot Actuator, phpinfo, Django debug pages, Swagger/OpenAPI UI, heap dumps, and health endpoints that leak configuration, environment variables, credentials, or internal topology — enabling reconnaissance and often direct compromise.
"""
description = """
We discovered that debug or management endpoints were reachable without proper access control and disclosed sensitive runtime information.

**TODO: technical description**

Commonly exposed surfaces:

- Spring Boot Actuator (`/actuator/env`, `/actuator/heapdump`, `/actuator/mappings`, `/actuator/gateway`);
- Java/Node/Python debug consoles, interactive shells, or Werkzeug/Django debug tracebacks;
- Swagger UI / OpenAPI / GraphQL playground without auth, revealing full API surface and sometimes “Try it out” against live backends;
- `phpinfo()`, server-status, server-info, and similar server diagnostic pages;
- Application health/metrics endpoints that embed secrets, connection strings, or internal hostnames;
- Profiling or tracing UIs (e.g. `/debug/pprof`) exposing memory and stack data.

Attackers use these endpoints to harvest credentials (from env dumps), map routes for further attacks, download heap dumps containing secrets in memory, or invoke dangerous actuator operations when write endpoints are enabled.
"""
recommendation = """
* Disable debug mode and developer tooling in production builds.
* Do not expose Actuator/management ports on the public network; bind to localhost or a management network and require strong authentication (and network ACL).
* Restrict or remove Swagger/OpenAPI UI in production; if retained, require authentication and disable “try it out” against production data where appropriate.
* Strip sensitive values from health/metrics responses; never return raw environment maps to unauthenticated clients.
* Block common diagnostic paths at the reverse proxy/WAF layer as defense in depth.
* Include exposure checks for `/actuator`, `/swagger`, `/phpinfo`, `/debug` in release and continuous monitoring.
"""
short_recommendation = "Disable production debug tooling; authenticate and network-restrict Actuator/Swagger/diagnostic endpoints; never expose env or heap dumps."
references = [
    "https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/01-Information_Gathering/README",
    "https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html",
]
affected_components = []

