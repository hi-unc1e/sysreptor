[translations.data]
title = "弱口令"
cvss = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
summary = """
系统中存在弱口令（如 admin/123456、默认口令、与用户名相同的口令等），攻击者可通过暴力破解或使用常见口令字典轻松获取有效账户凭证，进而登录系统并获得相应权限，可能导致敏感数据泄露、业务功能被滥用，甚至在获得管理员权限后完全控制目标系统。
"""
description = """
在渗透测试过程中，我们发现目标系统存在弱口令问题，并成功使用常见用户名与口令组合登录了系统账户。

**TODO：技术描述补充**

弱口令通常指容易被猜测或被暴力破解的口令，常见形式包括：

- 默认口令：设备、中间件或系统出厂自带口令未修改（如 admin/admin、root/root）；
- 简单口令：纯数字、纯字母、键盘序（123456、qwerty、111111）；
- 与用户名相同或高度相关的口令；
- 长度过短或字符组成单一的口令；
- 长期未更换的口令。

攻击者可使用 Hydra、Medusa 等工具对登录接口进行口令爆破，或利用已泄露的口令字典进行撞库攻击。一旦获得有效凭证，攻击者即可以后合法用户身份执行操作，绕过 perimeter 防护，直接威胁系统机密性与完整性。若该账户具有管理员权限，攻击者可进一步横向移动、提升权限，最终完全控制业务系统。

根据《中华人民共和国网络安全法》及等级保护相关要求，弱口令属于常见且高风险的安全隐患，应及时整改。
"""
recommendation = """
**立即措施**

- 立即修改已发现的弱口令，通知所有用户更换强口令；
- 禁用或重命名常见默认账户（admin、test、guest 等）。

**长期加固**

- 强制口令策略：长度不少于 8 位（建议 12 位以上），包含大小写字母、数字和特殊字符；
- 登录接口增加验证码、行为校验或登录频率限制，防范自动化爆破；
- 连续登录失败 N 次后锁定账户或 IP（注意避免可被利用造成拒绝服务）；
- 启用双因素认证（2FA/MFA），降低单一口令泄露带来的风险；
- 定期开展弱口令巡检，将弱口令扫描纳入安全基线考核；
- 对管理人员进行安全意识培训，禁止口令共享与明文记录。
"""
short_recommendation = "立即修改弱口令，强制强口令策略，启用登录失败锁定与双因素认证，防范暴力破解。"
