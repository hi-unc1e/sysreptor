[translations.data]
title = "Weak Passwords"
cvss = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
summary = """
The system uses weak passwords (e.g. admin/123456, default credentials, passwords identical to usernames). Attackers can obtain valid account credentials via brute force or common password dictionaries and then log in with the corresponding privileges. This may lead to sensitive data disclosure, abuse of business functions, and — with administrative access — full control of the target system.
"""
description = """
During the penetration test we identified weak passwords on the target system and successfully authenticated using common username/password combinations.

**TODO: technical description**

Weak passwords are credentials that are easy to guess or brute-force. Common forms include:

- Default credentials: factory passwords for devices, middleware, or systems left unchanged (e.g. admin/admin, root/root);
- Simple passwords: digits-only, letters-only, keyboard patterns (123456, qwerty, 111111);
- Passwords identical to or highly correlated with the username;
- Passwords that are too short or use a narrow character set;
- Passwords that have not been rotated for a long time.

Attackers can use tools such as Hydra or Medusa to brute-force login endpoints, or reuse leaked password dictionaries for credential stuffing. Once valid credentials are obtained, the attacker operates as a legitimate user and bypasses perimeter defenses, directly threatening confidentiality and integrity. With administrative privileges, further lateral movement and privilege escalation can lead to full compromise of the business system.

Weak passwords are a common high-risk finding under applicable cybersecurity and graded protection requirements and should be remediated promptly.
"""
recommendation = """
**Immediate actions**

- Immediately change all identified weak passwords and require all users to set strong passwords;
- Disable or rename common default accounts (admin, test, guest, etc.).

**Long-term hardening**

- Enforce a password policy: minimum length of 8 characters (12+ recommended), requiring upper/lowercase letters, digits, and special characters;
- Add CAPTCHA, behavioral checks, or rate limiting on login endpoints to hinder automated brute force;
- Lock the account or IP after N consecutive failed logins (avoid lockouts that enable denial of service);
- Enable multi-factor authentication (2FA/MFA) to reduce the impact of single-factor credential compromise;
- Periodically audit for weak passwords and include weak-password scanning in the security baseline;
- Provide security awareness training; prohibit password sharing and plaintext storage of credentials.
"""
short_recommendation = "Immediately change weak passwords, enforce a strong password policy, enable login lockout and multi-factor authentication, and mitigate brute-force attacks."
references = [
    "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html",
    "https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/04-Authentication_Testing/07-Testing_for_Weak_Password_Policy",
]
affected_components = []
