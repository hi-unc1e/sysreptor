[translations.data]
title = "Broken Access Control (Vertical Privilege Escalation)"
cvss = "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
summary = """
The application fails to enforce authorization correctly, allowing a lower-privileged authenticated user to access administrative or otherwise restricted functions and data (vertical privilege escalation). Combined with missing or incomplete role checks, this can lead to unauthorized configuration changes, mass data access, and compromise of other users' accounts.
"""
description = """
We identified broken access control enabling vertical privilege escalation. A low-privilege account could invoke endpoints or UI actions reserved for administrators or higher roles.

**TODO: technical description**

Broken Access Control is consistently ranked among the most critical OWASP risks. Vertical privilege escalation differs from IDOR/horizontal issues: instead of accessing another user's object of the same type, the attacker reaches higher-privilege functionality.

Typical manifestations:

- Admin APIs reachable without role checks when only the frontend hides the menu;
- Forced browsing to `/admin`, `/manage`, or undocumented API paths;
- Role or `isAdmin` flags trusted from the client (JWT claims, cookies, request body) without server-side verification;
- Missing authorization on secondary methods (PUT/PATCH/DELETE) while GET appears protected;
- Feature flags or “debug” modes that elevate privileges when a parameter is toggled.

Successful abuse may allow changing other users' passwords, exporting PII, modifying security settings, or deploying malicious content — depending on the privileged surface exposed.
"""
recommendation = """
* Enforce authorization on every server-side endpoint; never rely on UI hiding alone.
* Derive roles and permissions exclusively from trusted server-side session/identity state; never trust client-supplied role flags.
* Apply deny-by-default policies and centralize access-control checks (middleware/filters/gateways).
* Cover privilege boundaries with automated tests (low-priv token against admin routes must yield 403/404).
* Review JWT/session design so privilege claims cannot be forged or escalated without signature/validation failures.
* See OWASP Access Control Cheat Sheet and A01:2021 Broken Access Control.
"""
short_recommendation = "Enforce server-side, deny-by-default authorization on every privileged endpoint; never trust client-supplied roles."
references = [
    "https://owasp.org/Top10/A01_2021-Broken_Access_Control/",
    "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html",
]
affected_components = []

