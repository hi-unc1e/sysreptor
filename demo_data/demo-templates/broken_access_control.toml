[translations.data]
title = "失效的访问控制（垂直越权）"
cvss = "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
summary = """
应用未能正确实施授权控制，导致低权限已认证用户可以访问管理功能或其他受限功能与数据（垂直越权）。在角色校验缺失或不完整的情况下，可能造成未授权配置变更、批量数据访问以及其他用户账户被攻陷。
"""
description = """
我们发现存在失效的访问控制，可导致垂直越权。低权限账户能够调用本应仅限管理员或更高角色使用的接口或界面操作。

**TODO：技术描述补充**

失效的访问控制长期位列 OWASP 最严重风险之中。垂直越权不同于 IDOR/水平越权：攻击者不是访问同类型的其他用户对象，而是触达更高权限的功能面。

典型表现：

- 仅靠前端隐藏菜单，后台管理 API 未做角色校验即可访问；
- 强制浏览 `/admin`、`/manage` 或未公开的 API 路径；
- 信任客户端提交的角色或 `isAdmin` 标志（JWT 声明、Cookie、请求体），服务端未校验；
- GET 看似受保护，而 PUT/PATCH/DELETE 等方法缺少授权；
- 通过参数切换功能开关或“调试”模式以提升权限。

成功滥用可能允许修改其他用户密码、导出个人信息、变更安全配置或部署恶意内容——具体取决于暴露的特权面。
"""
recommendation = """
* 在每一个服务端接口上实施授权，切勿仅依赖 UI 隐藏。
* 角色与权限只能来自可信的服务端会话/身份状态；切勿信任客户端提供的角色标志。
* 采用默认拒绝策略，并将访问控制检查集中在中间件/过滤器/网关层。
* 用自动化测试覆盖权限边界（低权限令牌访问管理路由必须返回 403/404）。
* 审视 JWT/会话设计，确保权限声明无法在验签/校验失败的情况下被伪造或提升。
* 参见 OWASP 访问控制速查表与 A01:2021 Broken Access Control。
"""
short_recommendation = "对每个特权接口实施服务端默认拒绝的授权校验；切勿信任客户端提供的角色信息。"
references = [
    "https://owasp.org/Top10/A01_2021-Broken_Access_Control/",
    "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html",
]
