[translations.data]
title = "Authentication Bypass"
cvss = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
summary = """
The application contains flaws that allow attackers to bypass authentication and access protected resources or assume another user's identity without valid credentials. Depending on the weakness, this may enable anonymous access to administrative functions, account takeover, or complete compromise of the authentication boundary.
"""
description = """
We identified an authentication bypass that allowed access to protected functionality without presenting valid credentials (or by forging/abusing authentication artifacts).

**TODO: technical description**

Authentication bypass covers a range of design and implementation failures, including:

- Missing authentication on “hidden” or secondary endpoints (path guessing, alternate API versions);
- Predictable or forgeable session tokens, JWT with `alg=none` or weak HMAC secrets, unsigned cookies;
- Password-reset / magic-link flows that accept predictable tokens or skip ownership checks;
- Logic flaws: SQL/NoSQL injection in the login query, response manipulation, forced browsing past the login page when only the frontend enforces auth;
- Trusting client-side flags (`authenticated=true`) or misconfigured SSO/OAuth (open redirect, token confusion, missing `state`/`nonce`);
- Default or backdoor credentials left enabled.

Once authentication is bypassed, subsequent authorization checks may still apply — or may also be absent — amplifying impact to full account or system takeover.
"""
recommendation = """
* Require authentication on every protected route at the server/API gateway layer; never rely on frontend-only gates.
* Use strong, high-entropy session tokens or properly signed JWTs with verified algorithms; reject `none` and unexpected `alg` values.
* Harden account recovery: single-use, short-lived, unpredictable tokens bound to the account and purpose.
* Parameterize authentication queries; treat login as a sensitive flow with rate limiting and anomaly detection.
* Correctly implement OAuth/OIDC (validate `state`, `nonce`, audience, issuer, redirect URI allowlist).
* Remove default/backdoor accounts; rotate secrets used to sign tokens.
* See OWASP Authentication Cheat Sheet and A07:2021 Identification and Authentication Failures.
"""
short_recommendation = "Enforce server-side authentication on all protected routes; use strong tokens/JWTs and harden recovery and SSO flows."
references = [
    "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html",
    "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/",
]
